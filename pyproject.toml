[build-system]
build-backend = "hatchling.build"
requires = ["hatch-vcs>=0.5", "hatchling>=1.33.0"]

[project]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = ["coverage>=7", "pytest-cov>=5", "pytest>=8"]
description = "Isolated coverage reporting for Python tests."
dynamic = ["version"]
keywords = ["coverage", "pytest", "testing"]
license = "MIT"
license-files = ["LICENSE"]
name = "coverage-isolate"
readme = "README.md"
requires-python = ">=3.12"

[project.optional-dependencies]
completion = ["argcomplete>=3"]

[project.scripts]
coverage-isolate = "coverage_isolate.cli:main"

[project.entry-points.pytest11]
coverage-isolate = "coverage_isolate.plugin"

[dependency-groups]
coverage = ["pytest-cov==7.1.0", { include-group = "test" }]
dev = [
  "build==1.6.1",
  { include-group = "coverage" },
  { include-group = "format" },
  { include-group = "prek" },
  { include-group = "spell" },
  { include-group = "types" },
]
format = [
  "taplo==0.9.3",
  { include-group = "lint" },
  { include-group = "prek" },
]
lint = ["ruff==0.17.6"]
prek = ["prek==0.5.10"]
spell = ["codespell==2.4.3"]
test = ["pytest==9.2.0"]
types = ["basedpyright==1.40.2", { include-group = "test" }]

[tool.basedpyright]
exclude = ["tests/data"]
include = ["coverage_isolate", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."

[tool.codespell]
skip = "node_modules,tests/data"

[tool.coverage.report]
fail_under = 100
precision = 2
show_missing = true

[tool.coverage.run]
branch = true
omit = ["coverage_isolate/_version.py"]
source = ["coverage_isolate"]

[tool.sync-with-uv.repo-to-package]
"https://github.com/DetachHead/basedpyright-prek-mirror" = "basedpyright"

[tool.pytest.ini_options]
addopts = ["--durations=10", "--import-mode=importlib"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["tests/data"]
force-exclude = true
line-length = 88
target-version = "py312"

[tool.ruff.lint]
ignore = [
  "incorrect-blank-line-before-class",
  "missing-copyright-notice",
  "undocumented-public-package",
]
preview = true
select = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"!**/conftest.py" = ["pytest-fixture-autouse"]
"tests/**/*.py" = [
  "assert",
  "boolean-type-hint-positional-argument",
  "import-private-name",
  "magic-value-comparison",
  "private-member-access",
  "suspicious-non-cryptographic-random-usage",
  "suspicious-subprocess-import",
  "too-many-arguments",
  "too-many-positional-arguments",
  "undocumented-magic-method",
  "undocumented-public-class",
  "undocumented-public-function",
  "undocumented-public-init",
  "undocumented-public-method",
  "undocumented-public-module",
  "undocumented-public-nested-class",
  "unused-function-argument",
]
"tests/test_cli.py" = ["subprocess-without-shell-equals-true"]

[tool.hatch.version]
fallback-version = "0.1.0"
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "coverage_isolate/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["coverage_isolate"]
